mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.png" #这个是头像

# 文章署名与版权主体（页脚 "© 2020 - 2026 OVORegulus" 使用的就是这里）
author    = "OVORegulus"
copyright = "OVORegulus"

# ==============================================================================
# 页脚配置 (Footer)
# ==============================================================================
[footer]
    # 页脚只显示当前年份 "© 2026 OVORegulus"。
    # 若想显示成 "© 2020 - 2026"，把下面这行取消注释并填创建年份即可。
    # since = 2020

    # 页脚的链接行（支持 HTML）。留空则只显示上面的版权行
    customText = '我的主页：<a href="https://github.com/OVORegulus" target="_blank" rel="noopener">GitHub</a> · <a href="https://space.bilibili.com/1958074316" target="_blank" rel="noopener">BiliBili</a> · <a href="mailto:regulus@hunnu.edu.cn">邮箱</a>'

# ==============================================================================
# 侧边栏配置 (Sidebar) - 也就是你个人信息展示区
# ==============================================================================
[sidebar]
    # 个人简介旁边的装饰表情符号
    emoji    = "✏️"
    # 个人简介/副标题。你可以把它改成 "热爱编程的某某" 或 "记录生活与思考"
    subtitle = "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    # 个人头像图片的路径
    avatar   = "img/avatar.png"

# ==============================================================================
# 文章配置 (Article)
# ==============================================================================
[article]
    # 版权协议设置
    [article.license]
        # 是否在文章末尾显示版权声明
        enabled = true
        # 默认使用的版权协议链接（这里使用的是 CC BY-NC-SA 4.0）
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

# ==============================================================================
# 挂件/组件配置 (Widgets) - 控制首页和页面的功能模块
# ==============================================================================
[widgets]
    # 首页显示的模块列表（按顺序排列）
    homepage = [
        { type = "search" },                # 搜索框
        { type = "archives", params = { limit = 5 } }, # 文章归档（显示最近5条）
        { type = "categories", params = { limit = 10 } }, # 分类列表（显示前10个）
        { type = "tag-cloud", params = { limit = 10 } },  # 标签云（显示前10个）
    ]
    # 文章详情页显示的模块
    page     = [{ type = "toc" }]          # TOC (Table of Contents) 文章目录

# ==============================================================================
# 评论系统配置 (Comments)
# ==============================================================================
[comments]
    # 是否启用评论功能
    enabled  = true
    # 使用的评论平台提供商。这里是 "disqus"，你也可以改为其他支持的平台
    provider = "disqus"

# ==============================================================================
# 背景音乐播放器 (Music Player) —— 显示在左侧边栏主菜单下方
# ==============================================================================
# 用法（推荐）：
#   把音频文件（mp3 等）直接丢进 assets/audio/ 目录，就会自动进歌单。
#   文件名即曲名，会自动去掉 01- 这类序号前缀：
#       assets/audio/01-示例音频.mp3  ->  显示「示例音频」
#       assets/audio/02-night-drive.mp3 ->  显示「night drive」
#   想在侧边栏排出固定顺序，用文件名前缀编号即可（01-、02-…）。
#
# 想自定义某首的显示名或歌手，针对该文件写一条覆盖（src 写 audio/<文件名>）：
#       [[musicPlayer.playlist]]
#           src    = "audio/01-示例音频.mp3"
#           name   = "想显示的名字"
#           artist = "歌手"
#
# 想完全手写歌单、不用自动扫描：把下面的 autoDiscover 设为 false。
#
# 关于自动播放：带声音的自动播放会被所有现代浏览器拦截，所以进入页面时是
# 「静音自动播放」，页面会显示「点击开启声音」的提示，访客点一下就有声。
# ==============================================================================
[musicPlayer]
    enable   = true
    # true = 自动扫描 assets/audio/ 里的音频文件生成歌单
    autoDiscover = true
    # true = 进页面静音自动播放；false = 访客需自己点播放
    autoplay = true
    # 初始音量 0.0 ~ 1.0
    volume   = 0.5
    # 循环方式：all = 列表循环，one = 单曲循环，none = 播完停止
    loop     = "all"

    # --------------------------------------------------------------------------
    # 可选：针对具体文件的覆盖（不写也能正常播放，只是用文件名当曲名）
    # 下面这条对应 assets/audio/02-night-drive.mp3；该文件不存在时会打印 WARN，
    # 所以放上自己的歌之后，把不需要的覆盖项删掉即可。
    # --------------------------------------------------------------------------
    # [[musicPlayer.playlist]]
    #     src    = "audio/02-night-drive.mp3"
    #     name   = "Night Drive"
    #     artist = "歌手"

# ==============================================================================
# Cookie 同意（GDPR）
# ==============================================================================
[cookies]
    # 是否在页面底部弹出 "我们使用 Cookie" 的同意提示栏
    enabled = false

    # 具体的 Cookie 类别权限
    [cookies.categories]
        analytics  = true  # 统计分析类 Cookie (如 Google Analytics)
        functional = true  # 功能性 Cookie (如保存用户设置)
