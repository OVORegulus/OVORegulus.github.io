# ==============================================================================
# 语言配置：仅中文
# defaultContentLanguage = "zh" 定义在 hugo.toml 中。
# 单语言时主题不会渲染语言切换下拉框。
#
# 说明：content/ 里仍保留着 *.ja.md / *.zh-hant-tw.md 等变体文件，
# 但因为这里没有注册对应语言，它们不会参与渲染、也不会生成任何页面。
# 哪天想恢复多语言，取消下面注释（并补上标题等参数）即可。
# ==============================================================================
[zh]
    locale = "zh-cn"
    label  = "简体中文"
    title  = "Regulus的个人blog"
    weight = 1

    [zh.params.sidebar]
        subtitle = "一个小ACG的爱好者，目前是python和cpp在学，至于java我祝他好运"

